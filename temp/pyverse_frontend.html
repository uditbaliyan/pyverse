<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>PyVerse</title>
<script src="https://cdn.tailwindcss.com"></script>
<script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.x.x/dist/cdn.min.js"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Archivo+Black&family=JetBrains+Mono:wght@400;500;600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --color-bg:#eae1c8; --color-bg-2:#e2d8bc; --color-ink:#1b1712;
    --color-screen:#8c9873; --color-screen-dk:#6e7a5a; --color-red:#b23a2e;
    --color-device:#ddd4b4; --color-device-edge:#b9af8e;
    --color-muted:#5b5645; --color-body-txt:#3a342a;
    --color-s1:#c0392b; --color-s2:#e08a3c; --color-s3:#e8c547;
    --color-s4:#7a9b5c; --color-s5:#4a8b7c; --color-s6:#3d6b8c;
    --shadow-device:8px 8px 0 #b9af8e; --shadow-card:6px 6px 0 #b9af8e; --shadow-card-h:9px 9px 0 #b23a2e;
  }
  body{background:var(--color-bg); color:var(--color-body-txt); font-family:'Inter',sans-serif;}
  .f-black{font-family:'Archivo Black',sans-serif;}
  .f-mono{font-family:'JetBrains Mono',monospace;}
  .ink-border{border:3px solid var(--color-ink);}
  .card-poster{background:var(--color-bg-2); border:3px solid var(--color-ink); box-shadow:var(--shadow-card); transition:box-shadow .1s ease, transform .1s ease;}
  .card-poster:hover{box-shadow:var(--shadow-card-h); transform:translate(-2px,-2px);}
  .badge-mono{font-family:'JetBrains Mono',monospace; font-size:11px; padding:3px 7px; background:var(--color-ink); color:var(--color-bg);}
  .badge-stripe{font-family:'JetBrains Mono',monospace; font-size:11px; padding:3px 7px; border:2px solid var(--color-ink); color:var(--color-ink);}
  .progress-poster{background:var(--color-bg); border:2px solid var(--color-ink); height:12px;}
  .progress-poster > div{background:var(--color-ink); height:100%;}
  .btn-primary{font-family:'JetBrains Mono',monospace; font-weight:700; font-size:13px; border:3px solid var(--color-ink); background:var(--color-red); color:#F5EEDA; padding:10px 18px; transition:background .1s ease;}
  .btn-primary:hover{background:#963026;}
  .btn-outline{font-family:'JetBrains Mono',monospace; font-weight:700; font-size:13px; border:3px solid var(--color-ink); color:var(--color-ink); padding:10px 18px; transition:all .1s ease;}
  .btn-outline:hover{background:var(--color-ink); color:var(--color-bg);}
  .crumb{font-family:'JetBrains Mono',monospace; font-size:12px; color:var(--color-muted);}
  .crumb .current{color:var(--color-ink); font-weight:600;}
  .device{background:var(--color-device); border:3px solid var(--color-ink); box-shadow:var(--shadow-device); padding:14px;}
  .device-mini{background:var(--color-device); border:2px solid var(--color-ink); padding:8px;}
  .screen{background:var(--color-ink); padding:8px;}
  .screen-inner{background:var(--color-screen); color:#1F2914; border:2px solid var(--color-screen-dk); font-family:'JetBrains Mono',monospace;}
  .stripe-divider{height:12px; display:flex;}
  .stripe-divider > div{flex:1;}
  ::-webkit-scrollbar{width:8px;height:8px;}
  ::-webkit-scrollbar-thumb{background:var(--color-device-edge);}
  select{font-family:'JetBrains Mono',monospace;}
</style>
</head>
<body x-data="app()" class="text-base leading-relaxed">

  <!-- ============ NAVBAR ============ -->
  <header class="sticky top-0 z-30" style="background:var(--color-bg); border-bottom:3px solid var(--color-ink);">
    <div class="max-w-[1180px] mx-auto flex items-center gap-6 px-7 py-3">
      <button @click="go('home')" class="f-black text-lg tracking-tight shrink-0">PY<span style="color:var(--color-red)">VERSE</span></button>
      <nav class="hidden md:flex gap-1 f-mono text-sm">
        <template x-for="item in nav" :key="item.id">
          <button @click="go(item.id)" class="px-3 py-1.5"
            :style="topSection===item.id ? 'border-bottom:3px solid '+item.color+'; color:var(--color-ink); font-weight:700' : 'color:var(--color-muted)'">
            <span x-text="item.label"></span>
          </button>
        </template>
      </nav>
      <div class="ml-auto flex items-center gap-3 shrink-0">
        <div class="device-mini flex items-center gap-2 f-mono text-xs">
          <span>🔥</span><span x-text="streak"></span><span style="color:var(--color-muted)">day streak</span>
        </div>
      </div>
    </div>
    <div class="max-w-[1180px] mx-auto px-7 pb-2 flex items-center gap-2 crumb overflow-x-auto">
      <template x-for="(crumb,i) in trail" :key="i">
        <span class="flex items-center gap-2 shrink-0">
          <button @click="jumpTo(i)" :class="i===trail.length-1?'current':''" x-text="crumb.label"></button>
          <span x-show="i<trail.length-1" style="color:var(--color-device-edge)">/</span>
        </span>
      </template>
    </div>
    <div class="stripe-divider">
      <div style="background:var(--color-s1)"></div><div style="background:var(--color-s2)"></div>
      <div style="background:var(--color-s3)"></div><div style="background:var(--color-s4)"></div>
      <div style="background:var(--color-s5)"></div><div style="background:var(--color-s6)"></div>
    </div>
  </header>

  <main class="max-w-[1180px] mx-auto px-7 py-10">

  <!-- ============ HOME ============ -->
  <template x-if="topSection==='home'">
    <div>
      <section class="grid grid-cols-[60px_1fr_320px] gap-6 items-stretch max-[900px]:grid-cols-1 mb-14">
        <div class="max-[900px]:hidden [writing-mode:vertical-rl] f-mono text-xs tracking-[2px] px-1.5 py-4 flex items-center justify-center" style="background:var(--color-ink); color:var(--color-bg)">
          READ THE STACK, NOT THE GUESS
        </div>
        <div>
          <h1 class="f-black leading-[0.86] tracking-tighter" style="font-size:clamp(48px,8vw,96px)">PY<br>VERSE<span style="color:var(--color-red)">.</span></h1>
          <p class="mt-5 max-w-[46ch]" style="color:var(--color-body-txt)">Tracks that build on each other, problems that grade themselves, and a test at the end that actually means something.</p>
          <div class="mt-6 flex gap-3 flex-wrap">
            <button @click="go('tutorials')" class="btn-primary">CONTINUE TRACK</button>
            <button @click="go('practice')" class="btn-outline">VIEW PRACTICE</button>
          </div>
        </div>
        <div class="device">
          <div class="flex justify-between f-mono text-[10px]" style="color:var(--color-muted)"><span>PYVERSE UNIT</span><span>MODEL // PV-01</span></div>
          <div class="screen mt-2.5">
            <div class="screen-inner text-[11.5px] px-3 py-3.5 min-h-[130px]">
              <span class="font-bold" style="color:#26311A">&gt;&gt;&gt; trace(fn)</span><br>
              frame_0: locals={}<br>
              frame_1: x=[1, 2, 3]<br>
              <span class="font-bold" style="color:#26311A">&gt;&gt;&gt; step()</span>
            </div>
          </div>
          <div class="mt-3">
            <div class="flex justify-between f-mono text-xs mb-1" style="color:var(--color-muted)"><span>Track progress</span><span>34%</span></div>
            <div class="progress-poster"><div style="width:34%"></div></div>
          </div>
        </div>
      </section>

      <div class="flex items-baseline gap-3.5 mb-5">
        <h2 class="f-black text-2xl tracking-tight">Select a Module</h2>
        <span class="f-mono text-xs" style="color:var(--color-muted)" x-text="nav.filter(n=>n.id!=='home').length+' loaded'"></span>
      </div>
      <div class="grid grid-cols-[repeat(auto-fill,minmax(260px,1fr))] gap-[18px]">
        <template x-for="(item,i) in nav.filter(n=>n.id!=='home')" :key="item.id">
          <button @click="go(item.id)" class="card-poster text-left p-[18px]">
            <div class="flex justify-between items-center mb-2.5 f-mono text-[11px]">
              <span class="badge-mono" x-text="'0'+(i+1)"></span>
              <span :style="'color:'+item.color" x-text="item.tag"></span>
            </div>
            <h3 class="f-black text-lg mb-2 tracking-tight" x-text="item.label"></h3>
            <p class="text-[13.5px] mb-3" style="color:var(--color-body-txt)" x-text="item.blurb"></p>
            <div class="f-mono text-[10.5px] px-2 py-1.5 break-words" style="border:1px solid var(--color-screen-dk); color:var(--color-screen-dk); background:color-mix(in srgb, var(--color-screen) 20%, transparent)" x-text="'src: '+item.src"></div>
          </button>
        </template>
      </div>

      <footer class="mt-14 pt-4 flex justify-between flex-wrap gap-2.5 f-mono text-[11.5px]" style="border-top:3px solid var(--color-ink); color:var(--color-muted)">
        <span>PYVERSE · ALL MODULES RUN CLIENT-SIDE</span>
        <span>NO SERVER, NO WAIT</span>
      </footer>
    </div>
  </template>

  <!-- ============ TUTORIALS HUB ============ -->
  <template x-if="topSection==='tutorials'">
    <div>
      <h2 class="f-black text-2xl mb-1">Tutorials</h2>
      <p class="mb-5" style="color:var(--color-muted)">Microcourses for one idea, courses for a subject, tracks for a job-ready outcome.</p>
      <div class="flex gap-2 mb-6 f-mono text-sm">
        <template x-for="t in [{id:'track',label:'Tracks'},{id:'course',label:'Courses'},{id:'micro',label:'Microcourses'}]" :key="t.id">
          <button @click="tutorialsTab=t.id" class="px-3 py-1.5" :style="tutorialsTab===t.id?'border:2px solid var(--color-ink); background:var(--color-s2); color:var(--color-ink)':'border:2px solid var(--color-device-edge); color:var(--color-muted)'" x-text="t.label"></button>
        </template>
      </div>
      <div class="grid md:grid-cols-2 gap-4">
        <template x-for="c in courses.filter(c=>c.type===tutorialsTab)" :key="c.id">
          <button @click="isUnlocked(c) && openCourse(c)" class="card-poster text-left p-5" :style="!isUnlocked(c) ? 'opacity:.55; cursor:not-allowed; background:repeating-linear-gradient(45deg, var(--color-bg-2), var(--color-bg-2) 10px, var(--color-device-edge) 10px, var(--color-device-edge) 11px)' : ''">
            <div class="flex items-center justify-between mb-2">
              <span class="badge-stripe" x-text="c.level"></span>
              <span class="f-mono text-xs" style="color:var(--color-muted)" x-text="c.duration"></span>
            </div>
            <div class="font-bold mb-1 flex items-center gap-2">
              <span x-text="c.title"></span>
              <span x-show="!isUnlocked(c)" class="f-mono text-xs">🔒</span>
            </div>
            <div class="text-sm mb-3" style="color:var(--color-body-txt)" x-text="c.desc"></div>
            <template x-if="isUnlocked(c)"><div class="progress-poster"><div :style="'width:'+c.progress+'%'"></div></div></template>
            <template x-if="!isUnlocked(c)"><div class="f-mono text-xs" style="color:var(--color-muted)" x-text="'requires: '+courseTitle(c.requires)"></div></template>
          </button>
        </template>
      </div>
    </div>
  </template>

  <!-- ============ COURSE DETAIL ============ -->
  <template x-if="topSection==='course'">
    <div class="grid md:grid-cols-3 gap-6">
      <div class="md:col-span-2">
        <div class="f-mono text-xs mb-2" style="color:var(--color-s2)" x-text="activeCourse.level+' · '+activeCourse.duration"></div>
        <h2 class="f-black text-2xl mb-2" x-text="activeCourse.title"></h2>
        <p class="mb-6" style="color:var(--color-muted)" x-text="activeCourse.desc"></p>
        <div class="space-y-3">
          <template x-for="m in activeCourse.modules" :key="m.id">
            <div class="ink-border" style="background:var(--color-bg-2)">
              <button @click="toggleModule(m.id)" class="w-full flex items-center justify-between p-4 text-left">
                <div class="flex items-center gap-3">
                  <span class="w-5 h-5 flex items-center justify-center text-xs f-mono" :style="m.done?'background:var(--color-s4); border:2px solid var(--color-ink)':'border:2px solid var(--color-ink)'" x-text="m.done?'✓':''"></span>
                  <span class="font-bold" x-text="m.title"></span>
                </div>
                <span class="f-mono text-xs" x-text="(expandedModule===m.id?'▲':'▼')"></span>
              </button>
              <div x-show="expandedModule===m.id" class="px-4 pb-4 space-y-2" style="border-top:2px solid var(--color-ink)">
                <template x-for="it in m.items" :key="it.type+it.title">
                  <button @click="openItem(m,it)" class="w-full flex items-center justify-between p-2.5 mt-2" style="background:var(--color-bg); border:2px solid var(--color-device-edge)">
                    <span class="flex items-center gap-2 text-sm">
                      <span class="badge-stripe" :style="'border-color:'+itemColor(it.type)" x-text="itemLabel(it.type)"></span>
                      <span x-text="it.title"></span>
                    </span>
                    <span class="f-mono text-xs" style="color:var(--color-muted)" x-text="it.meta"></span>
                  </button>
                </template>
                <button @click="markModuleDone(m)" class="f-mono text-xs mt-2" style="color:var(--color-muted)" x-show="!m.done">mark module complete →</button>
              </div>
            </div>
          </template>

          <div class="card-poster p-5" :style="allDone?'border-color:var(--color-red)':''">
            <div class="flex items-center justify-between">
              <div>
                <div class="f-mono text-xs mb-1" style="color:var(--color-muted)" x-text="allDone?'unlocked':'🔒 locked · complete all modules'"></div>
                <div class="font-bold" x-text="'Final Assessment — '+activeCourse.title"></div>
                <div class="text-sm mt-1" style="color:var(--color-muted)">code + concept · pass mark 70%</div>
              </div>
              <button @click="allDone && openFinalTest()" :class="allDone?'btn-primary':'btn-outline'" :style="!allDone?'opacity:.5; cursor:not-allowed':''">Take test</button>
            </div>
          </div>
        </div>
      </div>

      <div class="device h-fit sticky top-32">
        <template x-if="!activeItem.title"><div class="text-sm" style="color:var(--color-muted)">Select a lesson, quiz, or lab to preview it here.</div></template>
        <template x-if="activeItem.title">
          <div>
            <span class="badge-stripe mb-3 inline-block" :style="'border-color:'+itemColor(activeItem.type)" x-text="itemLabel(activeItem.type)"></span>
            <div class="font-bold mb-3" x-text="activeItem.title"></div>

            <template x-if="activeItem.type==='lesson'">
              <div>
                <p class="text-sm mb-3" style="color:var(--color-body-txt)" x-text="activeItem.body"></p>
                <template x-if="activeItem.transcript">
                  <details class="mb-3"><summary class="f-mono text-xs cursor-pointer" style="color:var(--color-s5)">transcript</summary>
                    <pre class="f-mono text-xs mt-2 p-2 whitespace-pre-wrap" style="background:var(--color-bg); border:2px solid var(--color-device-edge)" x-text="activeItem.transcript"></pre>
                  </details>
                </template>
                <label class="flex items-center gap-2 f-mono text-xs" style="color:var(--color-muted)"><input type="checkbox" :checked="activeItem.read" @change="toggleRead(activeItem)"> mark as read</label>
              </div>
            </template>
            <template x-if="activeItem.type==='reading'">
              <div class="text-sm space-y-2" style="color:var(--color-body-txt)">
                <p x-text="activeItem.body"></p>
                <div class="f-mono text-xs px-2 py-1.5 flex items-center gap-2" style="background:var(--color-bg); border:2px solid var(--color-s5); color:var(--color-s5)">📎 <span x-text="activeItem.attachment"></span></div>
              </div>
            </template>
            <template x-if="activeItem.type==='quiz'">
              <div>
                <p class="text-sm mb-3 whitespace-pre-line" x-text="activeItem.q"></p>
                <div class="space-y-2">
                  <template x-for="(opt,i) in activeItem.options" :key="i">
                    <button @click="activeItem.picked=i" class="w-full text-left text-sm px-3 py-2" :style="activeItem.picked===i ? (i===activeItem.correct?'background:var(--color-s4); border:2px solid var(--color-ink)':'background:var(--color-s1); color:#fff; border:2px solid var(--color-ink)') : 'border:2px solid var(--color-device-edge)'" x-text="opt"></button>
                  </template>
                </div>
                <p x-show="activeItem.picked!==undefined && activeItem.picked!==null" class="f-mono text-xs mt-3 p-2" style="background:var(--color-bg); border:2px solid var(--color-device-edge); color:var(--color-muted)" x-text="activeItem.explanation"></p>
              </div>
            </template>
            <template x-if="activeItem.type==='lab'">
              <div>
                <div class="mb-3" style="border:2px solid var(--color-ink)">
                  <div class="f-mono text-xs px-3 py-1.5" style="background:var(--color-bg); color:var(--color-muted)">lab.py</div>
                  <div class="screen"><pre class="screen-inner text-xs p-3" x-text="activeItem.starter"></pre></div>
                  <div class="p-2" style="background:var(--color-bg)"><button @click="runLab(activeItem)" class="btn-primary text-xs px-3 py-1.5">Run ▶</button></div>
                </div>
                <div x-show="labRan" class="space-y-1.5">
                  <template x-for="(t,i) in activeItem.testResults" :key="i">
                    <div class="flex items-center justify-between f-mono text-xs px-2 py-1.5" style="background:var(--color-bg); border:2px solid var(--color-device-edge)">
                      <span x-text="t.input+' → '+t.expected"></span>
                      <span :style="t.pass?'color:var(--color-s4); font-weight:700':'color:var(--color-red); font-weight:700'" x-text="t.pass?'✓ pass':'✗ fail'"></span>
                    </div>
                  </template>
                </div>
              </div>
            </template>
          </div>
        </template>
      </div>
    </div>
  </template>

  <!-- ============ FINAL TEST ============ -->
  <template x-if="topSection==='finaltest' && !testSubmitted">
    <div class="max-w-xl">
      <div class="f-mono text-xs mb-2" style="color:var(--color-red)">Final Assessment</div>
      <h2 class="f-black text-2xl mb-6" x-text="activeCourse.title"></h2>
      <div class="card-poster p-5 mb-4">
        <p class="text-sm mb-4" x-text="'Q'+(testIndex+1)+' of '+testQuestions.length+' — '+testQuestions[testIndex].q.split('\n')[0]"></p>
        <template x-if="testQuestions[testIndex].q.includes('\n')">
          <pre class="f-mono text-xs p-3 mb-4" style="background:var(--color-bg); border:2px solid var(--color-device-edge)" x-text="testQuestions[testIndex].q.split('\n').slice(1).join('\n')"></pre>
        </template>
        <div class="space-y-2 f-mono text-sm">
          <template x-for="(opt,i) in testQuestions[testIndex].options" :key="i">
            <button @click="testAnswers[testIndex]=i" class="w-full text-left px-3 py-2" :style="testAnswers[testIndex]===i?'border:2px solid var(--color-ink); background:var(--color-s3)':'border:2px solid var(--color-device-edge)'" x-text="opt"></button>
          </template>
        </div>
      </div>
      <div class="progress-poster mb-2"><div :style="'width:'+((testIndex+1)/testQuestions.length*100)+'%'"></div></div>
      <div class="flex items-center justify-between">
        <p class="f-mono text-xs" style="color:var(--color-muted)" x-text="testAnswers.filter(a=>a!==null).length+' / '+testQuestions.length+' answered · pass mark 70%'"></p>
        <div class="flex gap-2">
          <button @click="testIndex>0 && testIndex--" class="btn-outline text-xs px-3 py-1.5">← Prev</button>
          <button x-show="testIndex<testQuestions.length-1" @click="testIndex++" class="btn-outline text-xs px-3 py-1.5">Next →</button>
          <button x-show="testIndex===testQuestions.length-1" @click="submitTest()" class="btn-primary text-xs px-3 py-1.5">Submit</button>
        </div>
      </div>
    </div>
  </template>

  <template x-if="topSection==='finaltest' && testSubmitted">
    <div class="max-w-xl">
      <div class="f-mono text-xs mb-2" style="color:var(--color-red)">Results</div>
      <h2 class="f-black text-2xl mb-1" x-text="activeCourse.title"></h2>
      <div class="f-mono text-sm mb-6" :style="testPassed?'color:var(--color-s4)':'color:var(--color-red)'" x-text="testPassed?'PASSED · '+testScorePct+'%':'NOT PASSED · '+testScorePct+'%'"></div>
      <template x-if="testPassed">
        <div class="device mb-6 text-center">
          <div class="f-mono text-xs mb-2" style="color:var(--color-muted)">CERTIFICATE OF COMPLETION</div>
          <div class="f-black text-lg mb-1" x-text="activeCourse.title"></div>
          <div class="text-sm mb-4" style="color:var(--color-muted)">Issued to U · <span x-text="new Date().toDateString()"></span></div>
          <button class="btn-primary">Download PDF</button>
        </div>
      </template>
      <div class="mb-6">
        <div class="f-mono text-xs mb-2" style="color:var(--color-muted)">score by topic</div>
        <div class="space-y-2">
          <template x-for="row in testTopicBreakdown" :key="row.topic">
            <div>
              <div class="flex justify-between f-mono text-xs mb-1" style="color:var(--color-muted)"><span x-text="row.topic"></span><span x-text="row.correct+' / '+row.total"></span></div>
              <div class="progress-poster"><div :style="'width:'+(row.correct/row.total*100)+'%'"></div></div>
            </div>
          </template>
        </div>
      </div>
      <div class="flex gap-2">
        <button @click="retakeTest()" class="btn-outline">Retake test</button>
        <button @click="go('tutorials')" class="btn-primary">Back to Tutorials</button>
      </div>
    </div>
  </template>

  <!-- ============ PRACTICE HUB ============ -->
  <template x-if="topSection==='practice'">
    <div>
      <h2 class="f-black text-2xl mb-1">Practice</h2>
      <p class="mb-5" style="color:var(--color-muted)">Sheets to follow, topics to drill, contests to race the clock.</p>
      <div class="flex gap-2 mb-6 f-mono text-sm">
        <template x-for="t in [{id:'problems',label:'Problems'},{id:'sheets',label:'Sheets'},{id:'topics',label:'Topics'},{id:'contests',label:'Contests'}]" :key="t.id">
