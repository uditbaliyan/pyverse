name: CI

# Enable Buildkit and let compose use it to speed up image building
env:
  DOCKER_BUILDKIT: 1
  COMPOSE_DOCKER_CLI_BUILD: 1

on:
  pull_request:
    branches: ['main']
    paths-ignore: ['docs/**']

  push:
    branches: ['main']
    paths-ignore: ['docs/**']

concurrency:
  group: ${{ github.head_ref || github.run_id }}
  cancel-in-progress: true

jobs:
  linter:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code Repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version-file: '.python-version'
      # Consider using pre-commit.ci for open source project
      - name: Run pre-commit
        uses: pre-commit/action@v3.0.1

  # With no caching at all the entire ci process takes 3m to complete!
  pytest:
    runs-on: ubuntu-latest

    env:
      # Fresh, empty SQLite file: CI must not depend on the committed db.sqlite3.
      DATABASE_URL: 'sqlite:///${{ github.workspace }}/ci.sqlite3'

    steps:
      - name: Checkout Code Repository
        uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: "true"

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version-file: ".python-version"

      - name: Install dependencies
        run: uv sync --locked

      - name: Fetch vendored browser assets
        run: uv run python utility/vendor_assets.py

      - name: Check DB Migrations
        # Scoped to project apps: unscoped, Wagtail 7.4.x reports a pending
        # wagtailcore migration that lives in site-packages (audit F-02).
        run: uv run python manage.py makemigrations --check --dry-run home lms quiz coding topics puput labs users

      - name: Run DB Migrations
        run: uv run python manage.py migrate

      - name: Test with pytest
        run: uv run pytest

  export:
    # Builds the static site from a clean checkout and fails if the export is
    # broken: sitemap/export drift, missing vendored assets, dead local refs.
    runs-on: ubuntu-latest
    env:
      DJANGO_SETTINGS_MODULE: config.settings.distill
      DATABASE_URL: 'sqlite:///${{ github.workspace }}/export.sqlite3'
      PYVERSE_CANONICAL_BASE_URL: https://pyverse.com
    steps:
      - name: Checkout Code Repository
        uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: "true"

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version-file: ".python-version"

      - name: Install dependencies
        run: uv sync --locked

      - name: Fetch vendored browser assets
        run: uv run python utility/vendor_assets.py

      - name: Build static site
        run: |
          uv run python manage.py migrate
          uv run python manage.py distill-local _site --collectstatic --force

      - name: Check export
        run: python3 utility/check_export.py _site

  e2e:
    # Headless-browser smoke test of the learner loop (pyverse/tests/e2e).
    # Uses the committed db.sqlite3 content and the vendored Pyodide, so it needs
    # no internet beyond installing Chromium. Playwright is added per run with
    # `--with` so it stays out of pyproject.toml / uv.lock.
    runs-on: ubuntu-latest
    env:
      DJANGO_SETTINGS_MODULE: config.settings.local
      PYVERSE_E2E_URL: http://127.0.0.1:8000
    steps:
      - name: Checkout Code Repository
        uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: "true"

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version-file: ".python-version"

      - name: Install dependencies
        run: uv sync --locked

      - name: Install Chromium
        run: uv run --with playwright playwright install --with-deps chromium

      - name: Fetch vendored browser assets
        run: uv run python utility/vendor_assets.py

      - name: Migrate and start the site
        run: |
          uv run python manage.py migrate
          nohup uv run python manage.py runserver 127.0.0.1:8000 --noreload > server.log 2>&1 &
          for i in $(seq 1 30); do curl -sf "$PYVERSE_E2E_URL/practice/problem/two-sum/" -o /dev/null && break; sleep 2; done

      - name: Browser smoke test
        run: uv run --with playwright pytest -m e2e pyverse/tests/e2e
