name: CI

# Enable Buildkit and let compose use it to speed up image building
env:
  DOCKER_BUILDKIT: 1
  COMPOSE_DOCKER_CLI_BUILD: 1

on:
  pull_request:
    branches: ['main']
    paths-ignore: ['docs/**']

  push:
    branches: ['main']
    paths-ignore: ['docs/**']

concurrency:
  group: ${{ github.head_ref || github.run_id }}
  cancel-in-progress: true

jobs:
  linter:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code Repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version-file: '.python-version'
      # Consider using pre-commit.ci for open source project
      - name: Run pre-commit
        uses: pre-commit/action@v3.0.1

  python-quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: "true"
      - uses: actions/setup-python@v6
        with:
          python-version-file: ".python-version"
      - run: uv sync --locked
      - name: Ruff
        run: uv run ruff check .
      - name: Mypy (non-blocking until the baseline is clean)
        continue-on-error: true
        run: uv run mypy pyverse
      - name: Known vulnerabilities in runtime dependencies
        run: uv export --no-dev --locked --no-emit-project -o /tmp/req.txt && uv run pip-audit -r /tmp/req.txt --no-deps --disable-pip

  # With no caching at all the entire ci process takes 3m to complete!
  pytest:
    runs-on: ubuntu-latest

    env:
      # Fresh, empty SQLite file: CI must not depend on the committed db.sqlite3.
      DATABASE_URL: 'sqlite:///${{ github.workspace }}/ci.sqlite3'

    steps:
      - name: Checkout Code Repository
        uses: actions/checkout@v6

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: "true"

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version-file: ".python-version"

      - name: Install dependencies
        run: uv sync --locked

      - name: Fetch vendored browser assets
        run: uv run python utility/vendor_assets.py

      - name: Check DB Migrations
        # Scoped to project apps: unscoped, Wagtail 7.4.x reports a pending
        # wagtailcore migration that lives in site-packages (audit F-02).
        run: uv run python manage.py makemigrations --check --dry-run home lms quiz coding topics puput labs users

      - name: Run DB Migrations
        run: uv run python manage.py migrate

      - name: Test with pytest
        run: uv run pytest

  export:
    # Builds the static site from a clean checkout and fails if the export is
    # broken: sitemap/export drift, missing vendored assets, dead local refs.
    runs-on: ubuntu-latest
    env:
      DJANGO_SETTINGS_MODULE: config.settings.distill
      DATABASE_URL: 'sqlite:///${{ github.workspace }}/export.sqlite3'
      PYVERSE_CANONICAL_BASE_URL: https://pyverse.com
    steps:
      - name: Checkout Code Repository
        uses: actions/checkout@v6

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: "true"

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version-file: ".python-version"

      - name: Install dependencies
        run: uv sync --locked

      - name: Fetch vendored browser assets
        run: uv run python utility/vendor_assets.py

      - name: Build Tailwind stylesheet
        # pyverse/theme/static/css/dist/styles.css is gitignored build output;
        # without it base.html links a stylesheet that does not exist (the
        # export check flags 404.html). django-tailwind uses a standalone
        # binary, so no Node is needed.
        run: uv run python manage.py tailwind build

      - name: Build static site
        run: |
          uv run python manage.py migrate
          uv run python manage.py load_content
          uv run python manage.py distill-local _site --collectstatic --force
          uv run python -m pyverse.relativize _site

      - name: Content gates
        run: |
          uv run python manage.py check_gym
          uv run python manage.py check_problem_traces

      - name: Check export (placeholders, dead refs, duplicate ids, page floor)
        run: python3 utility/check_export.py _site --min-pages 38

  e2e:
    # Headless-browser smoke test of the learner loop (pyverse/tests/e2e).
    # Uses content/site.json (load_content) and the vendored Pyodide, so it needs
    # no internet beyond installing Chromium. Playwright is added per run with
    # `--with` so it stays out of pyproject.toml / uv.lock.
    runs-on: ubuntu-latest
    env:
      DJANGO_SETTINGS_MODULE: config.settings.local
      DATABASE_URL: 'sqlite:///${{ github.workspace }}/e2e.sqlite3'
      PYVERSE_E2E_URL: http://127.0.0.1:8000
    steps:
      - name: Checkout Code Repository
        uses: actions/checkout@v6

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: "true"

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version-file: ".python-version"

      - name: Install dependencies
        run: uv sync --locked

      - name: Install Chromium
        run: uv run --with playwright playwright install --with-deps chromium

      - name: Fetch vendored browser assets
        run: uv run python utility/vendor_assets.py

      - name: Build Tailwind stylesheet
        # pyverse/theme/static/css/dist/styles.css is gitignored build output;
        # without it base.html links a stylesheet that does not exist (the
        # export check flags 404.html). django-tailwind uses a standalone
        # binary, so no Node is needed.
        run: uv run python manage.py tailwind build

      - name: Migrate and start the site
        run: |
          uv run python manage.py migrate
          uv run python manage.py load_content
          nohup uv run python manage.py runserver 127.0.0.1:8000 --noreload > server.log 2>&1 &
          for i in $(seq 1 30); do curl -sf "$PYVERSE_E2E_URL/practice/problem/two-sum/" -o /dev/null && break; sleep 2; done

      - name: Browser smoke test
        run: uv run --with playwright pytest -m e2e pyverse/tests/e2e
