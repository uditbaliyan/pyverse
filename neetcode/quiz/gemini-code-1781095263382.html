<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PyVerse - Standalone Parsons Quiz</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/Sortable/1.15.0/Sortable.min.js"></script>
    <style>
        :root {
            --bg-main: #f8fafc;
            --bg-card: #ffffff;
            --border-color: #e2e8f0;
            --text-main: #1e293b;
            --text-muted: #64748b;
            --primary: #2563eb;
            --primary-hover: #1d4ed8;
            --success: #10b981;
            --danger: #ef4444;
            --warning: #f59e0b;
            --code-bg: #f1f5f9;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background-color: var(--bg-main);
            color: var(--text-main);
            margin: 0;
            padding: 2rem;
        }

        .quiz-container {
            max-width: 1100px;
            margin: 0 auto;
            background: var(--bg-card);
            border: 1px solid var(--border-color);
            border-radius: 12px;
            padding: 2rem;
            box-shadow: 0 4px 6px -1px rgba(0,0,0,0.05);
        }

        .quiz-nav {
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 2px solid var(--border-color);
            padding-bottom: 1rem;
            margin-bottom: 1.5rem;
        }

        .quiz-nav h2 { margin: 0; font-size: 1.5rem; }
        
        .badge {
            background: var(--code-bg);
            color: var(--primary);
            padding: 0.25rem 0.75rem;
            border-radius: 9999px;
            font-size: 0.85rem;
            font-weight: 600;
        }

        .description-box {
            background: var(--bg-main);
            border-left: 4px solid var(--primary);
            padding: 1rem;
            border-radius: 0 8px 8px 0;
            margin-bottom: 2rem;
        }

        .description-box p { margin: 0 0 0.5rem 0; }
        .expected-out { font-family: monospace; font-size: 0.9rem; color: var(--success); font-weight: bold; }

        .workspace {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 2rem;
            margin-bottom: 2rem;
        }

        .panel {
            display: flex;
            flex-direction: column;
        }

        .panel-title {
            font-size: 0.85rem;
            text-transform: uppercase;
            letter-spacing: 0.05em;
            color: var(--text-muted);
            margin-bottom: 0.5rem;
            font-weight: 700;
        }

        .drop-zone {
            min-height: 350px;
            background: var(--bg-main);
            border: 2px dashed var(--border-color);
            border-radius: 8px;
            padding: 0.75rem;
        }

        .code-block {
            background: var(--bg-card);
            border: 1px solid var(--border-color);
            padding: 0.75rem 1rem;
            margin-bottom: 0.5rem;
            border-radius: 6px;
            cursor: grab;
            font-family: 'Fira Code', monospace;
            font-size: 0.9rem;
            display: flex;
            justify-content: space-between;
            align-items: center;
            user-select: none;
            box-shadow: 0 1px 2px rgba(0,0,0,0.02);
        }

        .code-block:active { cursor: grabbing; }
        .sortable-ghost { opacity: 0.3; background: var(--border-color); }

        /* Indentation Tiers */
        .indent-controls { display: none; gap: 0.25rem; }
        .indent-btn {
            background: var(--code-bg);
            border: 1px solid var(--border-color);
            border-radius: 4px;
            padding: 0.15rem 0.4rem;
            font-size: 0.75rem;
            cursor: pointer;
        }
        .indent-btn:hover { background: var(--border-color); }

        .indent-0 { margin-left: 0; border-left: 2px solid var(--border-color); }
        .indent-1 { margin-left: 2.5rem; border-left: 3px solid var(--primary); }
        .indent-2 { margin-left: 5rem; border-left: 3px solid var(--warning); }

        /* Feedback Terminal */
        .feedback-area {
            padding: 1rem;
            border-radius: 8px;
            font-family: monospace;
            white-space: pre-wrap;
            margin-bottom: 1.5rem;
            display: none;
        }
        .feedback-success { background: #ecfdf5; border: 1px solid #a7f3d0; color: #065f46; }
        .feedback-error { background: #fef2f2; border: 1px solid #fca5a5; color: #991b1b; }
        .feedback-warning { background: #fffbeb; border: 1px solid #fde68a; color: #92400e; }

        .footer-actions {
            display: flex;
            justify-content: space-between;
        }

        .btn {
            padding: 0.75rem 1.5rem;
            font-size: 0.95rem;
            font-weight: 600;
            border-radius: 6px;
            cursor: pointer;
            border: none;
            transition: all 0.2s;
        }
        .btn-primary { background: var(--primary); color: white; }
        .btn-primary:hover { background: var(--primary-hover); }
        .btn-secondary { background: var(--code-bg); color: var(--text-main); }
        .btn-secondary:hover { background: var(--border-color); }
    </style>
</head>
<body>

<div class="quiz-container">
    <div class="quiz-nav">
        <h2 id="quiz-title">Loading Challenge...</h2>
        <div>
            <span class="badge" id="quiz-concept">Concept</span>
            <span class="badge" id="quiz-idx">1/3</span>
        </div>
    </div>

    <div class="description-box">
        <p id="quiz-desc">Loading instructions...</p>
        <div><strong>Expected Standard Output:</strong> <span class="expected-out" id="quiz-expected"></span></div>
    </div>

    <div class="workspace">
        <div class="panel">
            <div class="panel-title">Available Code Blocks</div>
            <div id="poolZone" class="drop-zone"></div>
        </div>
        <div class="panel">
            <div class="panel-title">Your Construction Canvas (Drag & Indent Here)</div>
            <div id="canvasZone" class="drop-zone"></div>
        </div>
    </div>

    <div class="feedback-area" id="feedbackBox"></div>

    <div class="footer-actions">
        <button class="btn btn-secondary" onclick="prevQuestion()">Previous</button>
        <div>
            <button class="btn btn-secondary" onclick="resetCurrentQuestion()">Reset Layout</button>
            <button class="btn btn-primary" onclick="validateSolution()">Verify Quiz Block</button>
        </div>
        <button class="btn btn-secondary" onclick="nextQuestion()">Next</button>
    </div>
</div>

<script>
    // 3 Standalone Embedded Quiz Questions
    const quizDataset = [
        {
            title: "Looping Over a List",
            concept: "For Loops",
            description: "Arrange the lines to loop over the names list and print each name capitalized.",
            expected_output: "Alice\nBob\nCharlie",
            blocks: [
                { id: "q1_1", text: "names = ['alice', 'bob', 'charlie']", correct_order: 0, correct_indent: 0, is_distractor: false, feedback: "Initial list definition must look like this." },
                { id: "q1_2", text: "for x in names:", correct_order: 1, correct_indent: 0, is_distractor: false, feedback: "Missing colon or wrong indentation on loop definition statement." },
                { id: "q1_3", text: "print(x.capitalize())", correct_order: 2, correct_indent: 1, is_distractor: false, feedback: "Python loops demand indentation body block rules!" },
                { id: "q1_d1", text: "for x inside names:", correct_order: null, correct_indent: 0, is_distractor: true, feedback: "Syntax Error: Python uses the keyword 'in', not 'inside' for membership iteration loops." }
            ]
        },
        {
            title: "Conditional Mapping Guard",
            concept: "If/Else Statements",
            description: "Check if a number is positive, negative, or zero and print the status designation.",
            expected_output: "Negative",
            blocks: [
                { id: "q2_1", text: "num = -5", correct_order: 0, correct_indent: 0, is_distractor: false, feedback: "Variable definition assignment target must head script." },
                { id: "q2_2", text: "if num > 0:", correct_order: 1, correct_indent: 0, is_distractor: false, feedback: "The root condition evaluation requires index tier 0 alignment." },
                { id: "q2_3", text: "print('Positive')", correct_order: 2, correct_indent: 1, is_distractor: false, feedback: "This execution branch runs if positive condition clears. Indent it!" },
                { id: "q2_4", text: "elif num < 0:", correct_order: 3, correct_indent: 0, is_distractor: false, feedback: "Elif structurally sits parallel line matched back with base if." },
                { id: "q2_5", text: "print('Negative')", correct_order: 4, correct_indent: 1, is_distractor: false, feedback: "Negative payload string missing proper nested indentation spacing." },
                { id: "q2_d1", text: "else if num < 0:", correct_order: null, correct_indent: 0, is_distractor: true, feedback: "Syntax Error: JavaScript uses 'else if', Python uses 'elif'." }
            ]
        },
        {
            title: "Basic Accumulator Calculation",
            concept: "While Accumulator",
            description: "Construct a while loop that accumulates and sums up integers from 1 up to 3.",
            expected_output: "6",
            blocks: [
                { id: "q3_1", text: "count = 1\ntotal = 0", correct_order: 0, correct_indent: 0, is_distractor: false, feedback: "Setup variable baselines on tier zero space." },
                { id: "q3_2", text: "while count <= 3:", correct_order: 1, correct_indent: 0, is_distractor: false, feedback: "Check evaluation statement structure." },
                { id: "q3_3", text: "total += count\ncount += 1", correct_order: 2, correct_indent: 1, is_distractor: false, feedback: "Both increment tracks belong nested cleanly inside loop framework body." },
                { id: "q3_4", text: "print(total)", correct_order: 3, correct_indent: 0, is_distractor: false, feedback: "Print must execute after the loop concludes. Break out of indent block!" },
                { id: "q3_d1", text: "while count = 3:", correct_order: null, correct_indent: 0, is_distractor: true, feedback: "Syntax Error: Single assignment token '=' cannot represent matching boundary constraint comparisons '==' or '<='." }
            ]
        }
    ];

    let currentQuestionIdx = 0;

    function renderQuestion(idx) {
        const q = quizDataset[idx];
        document.getElementById('quiz-title').innerText = q.title;
        document.getElementById('quiz-concept').innerText = q.concept;
        document.getElementById('quiz-idx').innerText = `${idx + 1} / ${quizDataset.length}`;
        document.getElementById('quiz-desc').innerText = q.description;
        document.getElementById('quiz-expected').innerText = q.expected_output.replace(/\n/g, " ↵ ");
        
        const pool = document.getElementById('poolZone');
        const canvas = document.getElementById('canvasZone');
        pool.innerHTML = '';
        canvas.innerHTML = '';
        document.getElementById('feedbackBox').style.display = "none";

        // Deep copy/shuffle tracking items block array
        let shuffledBlocks = [...q.blocks].sort(() => Math.random() - 0.5);
        
        shuffledBlocks.forEach(b => {
            const blockEl = document.createElement('div');
            blockEl.className = 'code-block indent-0';
            blockEl.id = b.id;
            blockEl.dataset.indent = "0";
            blockEl.innerHTML = `
                <span>${escapeHtml(b.text)}</span>
                <div class="indent-controls">
                    <button class="indent-btn" onclick="shiftIndent('${b.id}', -1, event)">«</button>
                    <button class="indent-btn" onclick="shiftIndent('${b.id}', 1, event)">»</button>
                </div>
            `;
            pool.appendChild(blockEl);
        });
    }

    function shiftIndent(id, dir, event) {
        event.stopPropagation();
        const el = document.getElementById(id);
        let cur = parseInt(el.dataset.indent);
        let next = Math.max(0, Math.min(2, cur + dir));
        el.classList.remove(`indent-${cur}`);
        el.classList.add(`indent-${next}`);
        el.dataset.indent = next;
    }

    // Comprehensive Client-Side Evaluation Logic (Multi-Tier Mock Processing)
    function validateSolution() {
        const canvasItems = document.querySelectorAll('#canvasZone .code-block');
        const fb = document.getElementById('feedbackBox');
        fb.style.display = "block";
        
        if(canvasItems.length === 0) {
            fb.className = "feedback-area feedback-warning";
            fb.innerText = "⚠️ Your solution canvas is empty! Drag elements over from the pool panel first.";
            return;
        }

        const q = quizDataset[currentQuestionIdx];
        let rawCodeLines = [];
        let hasDistractor = false;
        let distractorMsg = "";
        let structureBroken = false;
        let structureMsg = "";

        canvasItems.forEach((item, index) => {
            const targetBlock = q.blocks.find(b => b.id === item.id);
            const userIndent = parseInt(item.dataset.indent);
            
            // Build hypothetical final code context array string (matching how you'll pipe items into PyScript)
            rawCodeLines.push("    ".repeat(userIndent) + targetBlock.text);

            // Tier 1 Validation: Distractor Check
            if(targetBlock.is_distractor) {
                hasDistractor = true;
                distractorMsg = `❌ Concept Mistake: Found an invalid logic block choice!\n\n"${targetBlock.text}"\n💡 Hint: ${targetBlock.feedback}`;
            }

            // Tier 2 Validation: Check structural sequence alignments and structural spaces
            if(!hasDistractor) {
                if(targetBlock.correct_order !== index) {
                    structureBroken = true;
                    structureMsg = `❌ Ordering Mistake: The statement sequences are out of alignment near row line ${index + 1}.`;
                } else if(targetBlock.correct_indent !== userIndent) {
                    structureBroken = true;
                    structureMsg = `⚠️ Scope/Indentation Warning at line ${index + 1}:\n"${targetBlock.text}"\n\n💡 Hint: ${targetBlock.feedback}`;
                }
            }
        });

        if(hasDistractor) {
            fb.className = "feedback-area feedback-error";
            fb.innerText = distractorMsg;
            return;
        }

        // Verify total blocks used count matching target answers counts
        const correctCount = q.blocks.filter(b => !b.is_distractor).length;
        if(!structureBroken && canvasItems.length < correctCount) {
            fb.className = "feedback-area feedback-warning";
            fb.innerText = "⚠️ Logic incomplete. Missing mandatory functional lines still resting in your pool selection.";
            return;
        }

        if(structureBroken) {
            fb.className = "feedback-area feedback-error";
            fb.innerText = structureMsg;
            return;
        }

        // Final Tier Assembly Simulation: Pass text variables directly downward
        fb.className = "feedback-area feedback-success";
        fb.innerText = `🎉 Correct Structure Match!\n\n[PyScript Output Pipeline Simulation Completed]:\n------------------------------------\n${rawCodeLines.join('\n')}\n------------------------------------\nResult Status: Success matching output stdout stream grid!`;
    }

    function resetCurrentQuestion() { renderQuestion(currentQuestionIdx); }
    function prevQuestion() { if(currentQuestionIdx > 0) { currentQuestionIdx--; renderQuestion(currentQuestionIdx); } }
    function nextQuestion() { if(currentQuestionIdx < quizDataset.length - 1) { currentQuestionIdx++; renderQuestion(currentQuestionIdx); } }
    function escapeHtml(str) { return str.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;"); }

    window.onload = () => {
        // Init sorting capabilities directly matching target containers
        new Sortable(document.getElementById('poolZone'), {
            group: 'quiz-group',
            animation: 120,
            onRemove: (evt) => { evt.item.querySelector('.indent-controls').style.display = 'none'; }
        });
        new Sortable(document.getElementById('canvasZone'), {
            group: 'quiz-group',
            animation: 120,
            onAdd: (evt) => { evt.item.querySelector('.indent-controls').style.display = 'flex'; }
        });

        renderQuestion(currentQuestionIdx);
    };
</script>
</body>
</html>
