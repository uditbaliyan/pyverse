<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />

<title>🏆 Code Memory: The Scouting Report</title>

<script src="https://cdn.tailwindcss.com"></script>

<link rel="stylesheet" href="https://pyscript.net/releases/2024.1.1/core.css">
<script type="module" src="https://pyscript.net/releases/2024.1.1/core.js"></script>

<style>
body{
    background:#f8fafc;
}

.code-terminal{
    background:#0f172a;
    transition:all .6s ease;
}

.code-hidden{
    filter:blur(12px);
    opacity:.15;
    pointer-events:none;
}

.progress-fill{
    transition:width 1s linear;
}

.option-btn{
    transition:all .2s ease;
}

.option-btn:hover{
    transform:translateY(-1px);
}

.correct{
    background:#dcfce7 !important;
    border-color:#22c55e !important;
    color:#166534 !important;
}

.wrong{
    background:#fee2e2 !important;
    border-color:#ef4444 !important;
    color:#991b1b !important;
}

.answer-reveal{
    background:#f1f5f9;
    border-left:4px solid #22c55e;
}

.fade-in{
    animation:fadeIn .45s ease;
}

@keyframes fadeIn{
    from{
        opacity:0;
        transform:translateY(8px);
    }
    to{
        opacity:1;
        transform:translateY(0);
    }
}
</style>
</head>
<body class="min-h-screen flex items-center justify-center p-6">

<div class="w-full max-w-6xl bg-white rounded-xl shadow-xl border border-slate-200 overflow-hidden">

    <!-- HEADER -->
    <div class="p-6 border-b border-slate-200">
        <div class="flex flex-col md:flex-row md:items-center md:justify-between gap-4">

            <div>
                <h1 class="text-3xl font-bold text-slate-800">
                    🏆 Code Memory: The Scouting Report
                </h1>

                <p id="phase-label"
                   class="mt-2 inline-flex items-center px-3 py-1 rounded-full bg-blue-100 text-blue-700 font-medium">
                    Memory Phase
                </p>
            </div>

            <div class="text-right">
                <div class="text-sm text-slate-500">
                    Inspection Time Remaining
                </div>
                <div id="timer-display"
                     class="text-2xl font-bold text-slate-800">
                    8s
                </div>
            </div>

        </div>

        <div class="mt-5 h-3 bg-slate-200 rounded-full overflow-hidden">
            <div id="progress-fill"
                 class="progress-fill h-full bg-gradient-to-r from-blue-500 to-indigo-600"
                 style="width:100%;">
            </div>
        </div>
    </div>

    <!-- CODE WINDOW -->
    <div class="p-6">

        <div id="code-terminal"
             class="code-terminal rounded-xl p-5 shadow-inner">

            <div class="flex items-center gap-2 mb-4">
                <div class="w-3 h-3 rounded-full bg-red-500"></div>
                <div class="w-3 h-3 rounded-full bg-yellow-500"></div>
                <div class="w-3 h-3 rounded-full bg-green-500"></div>

                <span class="text-slate-400 text-sm ml-3">
                    mission.py
                </span>
            </div>

            <pre id="code-content"
class="text-sm md:text-base font-mono text-slate-200 leading-7 whitespace-pre-wrap"></pre>

        </div>

        <!-- QUIZ AREA -->
        <div id="quiz-area" class="hidden mt-8 fade-in">
        </div>

    </div>

</div>

<script type="py">
from pyscript import document
import asyncio

MISSIONS = [
    {
        "title":"Endpoint Cache Handler",
        "code": '''
class DataEndpoint:
    def __init__(self, records):
        self.records = records
        self._cache = {}

    def process(self):
        results = []

        for i, record in enumerate(self.records):
            if record["active"]:
                value = record["score"] * 2
                results.append(value)

        self._cache["results"] = results
        return results

endpoint = DataEndpoint(records)
data = endpoint.process()
'''.strip(),

        "questions":[
            {
                "question":"What structure was used to initialize self._cache?",
                "options":["List","Dictionary","Set","None"],
                "answer":"Dictionary"
            },
            {
                "question":"How did the loop iterate through records?",
                "options":[
                    "for record in records:",
                    "while i < len(records):",
                    "for i, record in enumerate(self.records):",
                    "for key in records:"
                ],
                "answer":"for i, record in enumerate(self.records):"
            },
            {
                "question":"What key was stored in the cache?",
                "options":["processed","results","scores","data"],
                "answer":"results"
            }
        ]
    },

    {
        "title":"User Synchronizer",
        "code": '''
class UserSync:
    def __init__(self, users):
        self.users = users
        self.pending = []

    def sync(self):
        synced = 0

        for user in self.users:
            if user["verified"]:
                self.pending.append(user["id"])
                synced += 1

        return synced

service = UserSync(users)
count = service.sync()
'''.strip(),

        "questions":[
            {
                "question":"How was pending initialized?",
                "options":["Dictionary","Tuple","List","Set"],
                "answer":"List"
            },
            {
                "question":"What field was checked in the conditional?",
                "options":["active","email","verified","role"],
                "answer":"verified"
            },
            {
                "question":"What was appended to pending?",
                "options":["user","user['name']","user['id']","synced"],
                "answer":"user['id']"
            }
        ]
    }
]

current_mission = 0
answered = 0
SCOUT_TIME = 8

def get(id_):
    return document.getElementById(id_)

def render_mission():
    mission = MISSIONS[current_mission]

    get("code-content").textContent = mission["code"]

    terminal = get("code-terminal")
    terminal.classList.remove("code-hidden")

    get("quiz-area").classList.add("hidden")

    get("phase-label").innerText = "Memory Phase"
    get("phase-label").className = (
        "mt-2 inline-flex items-center px-3 py-1 rounded-full "
        "bg-blue-100 text-blue-700 font-medium"
    )

async def scouting_phase():
    progress = get("progress-fill")
    timer = get("timer-display")

    for remaining in range(SCOUT_TIME, -1, -1):

        timer.innerText = f"{remaining}s"

        width = (remaining / SCOUT_TIME) * 100
        progress.style.width = f"{width}%"

        if remaining == 0:
            break

        await asyncio.sleep(1)

    get("code-terminal").classList.add("code-hidden")

    await asyncio.sleep(0.4)

    show_quiz()

def answer_click(event):
    global answered

    btn = event.currentTarget
    chosen = btn.dataset.value
    correct = btn.dataset.answer

    parent = btn.parentElement

    buttons = parent.querySelectorAll("button")

    for b in buttons:
        b.disabled = True

    if chosen == correct:
        btn.classList.add("correct")
    else:
        btn.classList.add("wrong")

        for b in buttons:
            if b.dataset.value == correct:
                b.classList.add("correct")

    answered += 1

    total = len(MISSIONS[current_mission]["questions"])

    if answered == total:
        show_next_button()

def show_quiz():
    global answered
    answered = 0

    mission = MISSIONS[current_mission]

    area = get("quiz-area")
    area.innerHTML = ""

    get("phase-label").innerText = "Quiz Phase"
    get("phase-label").className = (
        "mt-2 inline-flex items-center px-3 py-1 rounded-full "
        "bg-emerald-100 text-emerald-700 font-medium"
    )

    html = f'''
    <div class="mb-6">
        <h2 class="text-2xl font-bold text-slate-800">
            Architectural Quiz
        </h2>

        <p class="text-slate-500 mt-1">
            Mission: {mission["title"]}
        </p>
    </div>
    '''

    area.innerHTML = html

    for idx, q in enumerate(mission["questions"]):

        wrapper = document.createElement("div")
        wrapper.className = (
            "mb-8 p-5 rounded-xl border border-slate-200 "
            "bg-slate-50"
        )

        question = document.createElement("h3")
        question.className = "font-semibold text-slate-800 mb-4"
        question.innerText = f"{idx+1}. {q['question']}"

        wrapper.appendChild(question)

        options_holder = document.createElement("div")
        options_holder.className = "grid md:grid-cols-2 gap-3"

        for opt in q["options"]:
            btn = document.createElement("button")

            btn.innerText = opt
            btn.dataset.value = opt
            btn.dataset.answer = q["answer"]

            btn.className = (
                "option-btn text-left px-4 py-3 rounded-lg "
                "border border-slate-300 bg-white"
            )

            btn.addEventListener("click", answer_click)

            options_holder.appendChild(btn)

        wrapper.appendChild(options_holder)
        area.appendChild(wrapper)

    area.classList.remove("hidden")

def show_next_button():
    area = get("quiz-area")

    holder = document.createElement("div")
    holder.className = "text-center mt-10"

    btn = document.createElement("button")

    btn.innerText = "🚀 Next Mission"

    btn.className = (
        "px-6 py-3 rounded-xl bg-indigo-600 "
        "text-white font-semibold hover:bg-indigo-700"
    )

    btn.addEventListener("click", next_mission)

    holder.appendChild(btn)
    area.appendChild(holder)

def next_mission(event):
    global current_mission

    current_mission += 1

    if current_mission >= len(MISSIONS):
        current_mission = 0

    asyncio.create_task(start_game())

async def start_game():
    render_mission()
    await scouting_phase()

asyncio.create_task(start_game())
</script>

</body>
</html>
