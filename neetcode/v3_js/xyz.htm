<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>

<title>BFS Queue Visualizer</title>

<script src="https://cdn.tailwindcss.com"></script>

<style>
    body {
        background: #0f172a;
        color: white;
        font-family: sans-serif;
    }

    .node {
        transition: all 0.4s ease;
    }

    .queue-item {
        transition: all 0.3s ease;
    }
</style>
</head>
<body class="min-h-screen p-8">

<div class="max-w-7xl mx-auto">

    <h1 class="text-4xl font-bold mb-8">
        BFS Queue Visualization
    </h1>

    <div class="grid grid-cols-1 lg:grid-cols-2 gap-8">

        <!-- GRAPH -->
        <div class="bg-slate-900 rounded-2xl p-6 shadow-2xl">

            <h2 class="text-2xl font-semibold mb-6">
                Graph
            </h2>

            <svg id="graph" width="500" height="400" class="w-full">

                <!-- EDGES -->
                <line x1="250" y1="60" x2="120" y2="160" stroke="#475569" stroke-width="3"/>
                <line x1="250" y1="60" x2="380" y2="160" stroke="#475569" stroke-width="3"/>
                <line x1="120" y1="160" x2="90" y2="300" stroke="#475569" stroke-width="3"/>
                <line x1="120" y1="160" x2="200" y2="300" stroke="#475569" stroke-width="3"/>
                <line x1="380" y1="160" x2="320" y2="300" stroke="#475569" stroke-width="3"/>
                <line x1="380" y1="160" x2="430" y2="300" stroke="#475569" stroke-width="3"/>

                <!-- NODES -->

                <g class="node" id="node-0">
                    <circle cx="250" cy="60" r="30" fill="#1e293b"/>
                    <text x="250" y="68" text-anchor="middle" fill="white" font-size="20">0</text>
                </g>

                <g class="node" id="node-1">
                    <circle cx="120" cy="160" r="30" fill="#1e293b"/>
                    <text x="120" y="168" text-anchor="middle" fill="white" font-size="20">1</text>
                </g>

                <g class="node" id="node-2">
                    <circle cx="380" cy="160" r="30" fill="#1e293b"/>
                    <text x="380" y="168" text-anchor="middle" fill="white" font-size="20">2</text>
                </g>

                <g class="node" id="node-3">
                    <circle cx="90" cy="300" r="30" fill="#1e293b"/>
                    <text x="90" y="308" text-anchor="middle" fill="white" font-size="20">3</text>
                </g>

                <g class="node" id="node-4">
                    <circle cx="200" cy="300" r="30" fill="#1e293b"/>
                    <text x="200" y="308" text-anchor="middle" fill="white" font-size="20">4</text>
                </g>

                <g class="node" id="node-5">
                    <circle cx="320" cy="300" r="30" fill="#1e293b"/>
                    <text x="320" y="308" text-anchor="middle" fill="white" font-size="20">5</text>
                </g>

                <g class="node" id="node-6">
                    <circle cx="430" cy="300" r="30" fill="#1e293b"/>
                    <text x="430" y="308" text-anchor="middle" fill="white" font-size="20">6</text>
                </g>

            </svg>

        </div>

        <!-- QUEUE + INFO -->
        <div class="space-y-6">

            <div class="bg-slate-900 rounded-2xl p-6 shadow-2xl">

                <h2 class="text-2xl font-semibold mb-4">
                    Queue
                </h2>

                <div id="queue"
                     class="flex gap-3 flex-wrap min-h-[60px]">
                </div>

            </div>

            <div class="bg-slate-900 rounded-2xl p-6 shadow-2xl">

                <h2 class="text-2xl font-semibold mb-4">
                    Current Node
                </h2>

                <div id="current"
                     class="text-5xl font-bold text-cyan-400">
                    -
                </div>

            </div>

            <div class="bg-slate-900 rounded-2xl p-6 shadow-2xl">

                <h2 class="text-2xl font-semibold mb-4">
                    Visited
                </h2>

                <div id="visited"
                     class="flex gap-3 flex-wrap">
                </div>

            </div>

            <div class="flex gap-4">

                <button id="prevBtn"
                        class="px-6 py-3 rounded-xl bg-slate-700 hover:bg-slate-600">
                    Prev
                </button>

                <button id="nextBtn"
                        class="px-6 py-3 rounded-xl bg-cyan-600 hover:bg-cyan-500">
                    Next
                </button>

            </div>

        </div>

    </div>

</div>

<script>

const graph = {
    0: [1, 2],
    1: [3, 4],
    2: [5, 6],
    3: [],
    4: [],
    5: [],
    6: []
};

function bfs(graph, start) {

    let visited = [];
    let queue = [start];
    let states = [];

    while (queue.length > 0) {

        let node = queue.shift();

        if (!visited.includes(node)) {

            visited.push(node);

            states.push({
                current: node,
                visited: [...visited],
                queue: [...queue]
            });

            queue.push(...graph[node]);
        }
    }

    return states;
}

const states = bfs(graph, 0);

let currentStep = 0;

function renderGraph(state) {

    // RESET NODES
    for (let i = 0; i <= 6; i++) {

        const circle =
            document.querySelector(`#node-${i} circle`);

        circle.setAttribute("fill", "#1e293b");
    }

    // VISITED
    state.visited.forEach(node => {

        const circle =
            document.querySelector(`#node-${node} circle`);

        circle.setAttribute("fill", "#16a34a");
    });

    // CURRENT
    const currentCircle =
        document.querySelector(`#node-${state.current} circle`);

    currentCircle.setAttribute("fill", "#06b6d4");

    // QUEUE
    const queueDiv = document.getElementById("queue");

    queueDiv.innerHTML = "";

    state.queue.forEach(item => {

        const div = document.createElement("div");

        div.className =
            "queue-item px-4 py-2 rounded-lg bg-orange-500 text-white font-bold";

        div.textContent = item;

        queueDiv.appendChild(div);
    });

    // CURRENT NODE
    document.getElementById("current").textContent =
        state.current;

    // VISITED
    const visitedDiv =
        document.getElementById("visited");

    visitedDiv.innerHTML = "";

    state.visited.forEach(item => {

        const div = document.createElement("div");

        div.className =
            "px-4 py-2 rounded-lg bg-green-600 font-bold";

        div.textContent = item;

        visitedDiv.appendChild(div);
    });
}

renderGraph(states[currentStep]);

document.getElementById("nextBtn")
.addEventListener("click", () => {

    if (currentStep < states.length - 1) {

        currentStep++;

        renderGraph(states[currentStep]);
    }
});

document.getElementById("prevBtn")
.addEventListener("click", () => {

    if (currentStep > 0) {

        currentStep--;

        renderGraph(states[currentStep]);
    }
});

</script>

</body>
</html>
