{% load wagtailcore_tags %}
<div class="pe-quiz-block pe-quiz-block--true-false">
  <p class="pe-quiz-statement">{{ value.statement }}</p>
  <p class="pe-quiz-prompt">True or false?</p>
  <details class="pe-quiz-reveal">
    <summary>Reveal answer</summary>
    <p><strong>{% if value.is_true %}True{% else %}False{% endif %}</strong></p>
    {% if value.explanation %}{{ value.explanation|richtext }}{% endif %}
  </details>
</div>
