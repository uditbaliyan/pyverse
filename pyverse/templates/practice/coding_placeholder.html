{% extends "base.html" %} {% block content %}
<div class="max-w-4xl mx-auto px-6 py-12 text-center">
  <h1 class="text-3xl font-bold mb-4">{{ problem.title }}</h1>
  <p class="text-neutral-500 mb-8">Concept: {{ concept.title }}</p>
  <div class="border-2 border-dashed border-neutral-300 rounded-xl p-12">
    <p class="text-neutral-400 text-lg">💻 Interactive Code Editor will load here.</p>
    <pre class="mt-4 text-left bg-neutral-900 text-green-400 p-4 rounded-lg text-sm">
{{ problem.starter_code }}</pre
    >
  </div>
  <a href="/practice/" class="mt-8 inline-block text-sm text-neutral-500 hover:underline"
    >← Back to Practice Hub</a
  >
</div>
{% endblock %}
