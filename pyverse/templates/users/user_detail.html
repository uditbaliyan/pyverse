{% extends "base.html" %}

{% block title %}{{ object.username }}{% endblock title %}
{% block content %}
  {% include "components/page_header.html" with title=object.username subtitle=object.name %}
  {% if object == request.user %}
    <div class="flex flex-wrap gap-3">
      <a class="btn" href="{% url 'users:update' %}">My info</a>
      <a class="btn btn-secondary" href="{% url 'account_email' %}">Email</a>
      <a class="btn btn-secondary" href="{% url 'mfa_index' %}">Two-factor auth</a>
    </div>
  {% endif %}
{% endblock content %}
