{% extends "base.html" %}

{% load crispy_forms_tags %}

{% block title %}{{ user.username }}{% endblock title %}
{% block content %}
  {% include "components/page_header.html" with title=user.username subtitle="Update your profile details." %}
  <form class="card !h-auto max-w-xl"
        method="post"
        action="{% url 'users:update' %}">
    {% csrf_token %}
    {{ form|crispy }}
    <div class="mt-2">
      <button type="submit" class="btn">Update</button>
    </div>
  </form>
{% endblock content %}
