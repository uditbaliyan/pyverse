<style>
  /* ---- Practice Ecosystem design tokens ----
     Palette:
       --pe-paper   #EFEDE6  page background, unbleached-paper neutral
       --pe-ink     #1F2421  primary text, near-black w/ a green cast
       --pe-mute    #6B6A62  secondary text
       --pe-line    #D9D5CB  hairline borders
       --pe-surface #FFFFFF  card/panel surface
       --pe-coding  #2D5F5D  teal — the "coding" editor tab + accents
       --pe-quiz    #5B4B8A  plum — the "quiz" editor tab + accents
       --pe-hidden  #B23A3A  used sparingly for "hidden test case" markers
     Type:
       Display/labels: 'IBM Plex Mono' (evokes a code editor's gutter/tabs)
       Body:           'IBM Plex Sans' (readable prose alongside code)
  */
  .pe-root {
    --pe-paper: #efede6;
    --pe-ink: #1f2421;
    --pe-mute: #6b6a62;
    --pe-line: #d9d5cb;
    --pe-surface: #ffffff;
    --pe-coding: #2d5f5d;
    --pe-quiz: #5b4b8a;
    --pe-hidden: #b23a3a;

    background: var(--pe-paper);
    color: var(--pe-ink);
    font-family:
      "IBM Plex Sans",
      -apple-system,
      sans-serif;
    line-height: 1.55;
    padding: 2.5rem 1.5rem 5rem;
  }

  .pe-root a {
    color: inherit;
  }

  .pe-shell {
    max-width: 920px;
    margin: 0 auto;
  }

  /* "File path" breadcrumb, styled like a tab's file path in an editor */
  .pe-path {
    font-family: "IBM Plex Mono", monospace;
    font-size: 0.8rem;
    color: var(--pe-mute);
    letter-spacing: 0.02em;
    margin-bottom: 0.75rem;
  }
  .pe-path a:hover {
    color: var(--pe-ink);
  }
  .pe-path .pe-sep {
    margin: 0 0.35rem;
    opacity: 0.5;
  }

  .pe-title {
    font-family: "IBM Plex Mono", monospace;
    font-weight: 600;
    font-size: 2rem;
    letter-spacing: -0.01em;
    margin: 0 0 0.25rem;
  }

  .pe-intro,
  .pe-theory {
    font-size: 1.02rem;
    max-width: 68ch;
    margin: 1rem 0 2rem;
  }
  .pe-theory :is(p, ul, ol) {
    margin: 0 0 1em;
  }
  .pe-theory code {
    font-family: "IBM Plex Mono", monospace;
    background: var(--pe-surface);
    border: 1px solid var(--pe-line);
    border-radius: 3px;
    padding: 0.1em 0.35em;
    font-size: 0.9em;
  }

  /* Signature element: an editor-style tab bar for Coding / Quiz */
  .pe-tabbar {
    display: flex;
    gap: 0.25rem;
    border-bottom: 1px solid var(--pe-line);
    margin: 2rem 0 0;
  }
  .pe-tab {
    font-family: "IBM Plex Mono", monospace;
    font-size: 0.85rem;
    padding: 0.65rem 1.1rem 0.55rem;
    border: 1px solid transparent;
    border-bottom: none;
    border-radius: 6px 6px 0 0;
    color: var(--pe-mute);
    text-decoration: none;
    background: transparent;
    display: inline-flex;
    align-items: center;
    gap: 0.5rem;
    transform: translateY(1px);
  }
  .pe-tab .pe-dot {
    width: 6px;
    height: 6px;
    border-radius: 50%;
    background: currentColor;
    opacity: 0.5;
  }
  .pe-tab[data-active="true"] {
    background: var(--pe-surface);
    border-color: var(--pe-line);
    color: var(--pe-ink);
  }
  .pe-tab[data-active="true"].pe-tab--coding {
    color: var(--pe-coding);
  }
  .pe-tab[data-active="true"].pe-tab--quiz {
    color: var(--pe-quiz);
  }
  .pe-tab .pe-count {
    font-size: 0.7rem;
    color: var(--pe-mute);
  }

  .pe-panel {
    background: var(--pe-surface);
    border: 1px solid var(--pe-line);
    border-radius: 0 6px 6px 6px;
    padding: 1.5rem;
  }

  .pe-empty {
    font-family: "IBM Plex Mono", monospace;
    font-size: 0.9rem;
    color: var(--pe-mute);
    padding: 2rem 0;
    text-align: center;
  }

  /* Cards */
  .pe-card-list {
    display: flex;
    flex-direction: column;
    gap: 0.75rem;
  }
  .pe-card {
    border: 1px solid var(--pe-line);
    border-radius: 6px;
    padding: 1rem 1.1rem;
    background: var(--pe-paper);
  }
  .pe-card-head {
    display: flex;
    align-items: baseline;
    justify-content: space-between;
    gap: 1rem;
  }
  .pe-card-title {
    font-weight: 600;
    font-size: 1rem;
    margin: 0;
  }
  .pe-badge {
    font-family: "IBM Plex Mono", monospace;
    font-size: 0.68rem;
    text-transform: uppercase;
    letter-spacing: 0.04em;
    padding: 0.2rem 0.5rem;
    border-radius: 3px;
    white-space: nowrap;
  }
  .pe-badge--coding {
    background: rgba(45, 95, 93, 0.12);
    color: var(--pe-coding);
  }
  .pe-badge--quiz {
    background: rgba(91, 75, 138, 0.12);
    color: var(--pe-quiz);
  }

  .pe-card-meta {
    font-family: "IBM Plex Mono", monospace;
    font-size: 0.78rem;
    color: var(--pe-mute);
    margin-top: 0.35rem;
  }

  /* Subtopic grid (hub + topic children) */
  .pe-topic-grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
    gap: 1rem;
    margin-top: 1.5rem;
  }
  .pe-topic-tile {
    display: block;
    text-decoration: none;
    border: 1px solid var(--pe-line);
    border-radius: 6px;
    padding: 1rem 1.1rem;
    background: var(--pe-surface);
    transition:
      border-color 0.15s ease,
      transform 0.15s ease;
  }
  .pe-topic-tile:hover {
    border-color: var(--pe-coding);
    transform: translateY(-1px);
  }
  .pe-topic-tile .pe-topic-name {
    font-weight: 600;
    display: block;
    margin-bottom: 0.2rem;
  }
  .pe-topic-tile .pe-topic-hint {
    font-family: "IBM Plex Mono", monospace;
    font-size: 0.72rem;
    color: var(--pe-mute);
  }

  /* Pagination */
  .pe-pagination {
    display: flex;
    justify-content: center;
    gap: 1rem;
    margin-top: 1.75rem;
    font-family: "IBM Plex Mono", monospace;
    font-size: 0.8rem;
  }
  .pe-pagination a {
    text-decoration: underline;
  }
  .pe-pagination .pe-page-current {
    color: var(--pe-mute);
  }

  @media (prefers-reduced-motion: reduce) {
    .pe-topic-tile {
      transition: none;
    }
  }

  @media (max-width: 560px) {
    .pe-title {
      font-size: 1.5rem;
    }
    .pe-tab {
      padding: 0.55rem 0.8rem 0.45rem;
      font-size: 0.78rem;
    }
  }
</style>
