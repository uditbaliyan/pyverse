{% extends "base.html" %} {% load wagtailcore_tags %} {% block content %}
<a href="{% pageurl page.get_parent %}">&larr; All courses</a>
<h1>{{ page.title }}</h1>
<p>{{ page.summary }}</p>

<ol class="course-list">
  {% for course in courses %}
  <li><a href="{% pageurl course %}">{{ course.title }}</a></li>
  {% endfor %}
</ol>
{% endblock %}
