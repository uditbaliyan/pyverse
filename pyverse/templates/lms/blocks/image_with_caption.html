{% load wagtailimages_tags %}

<figure class="my-6 {% if value.width == 'half' %}max-w-md{% elif value.width == 'wide' %}max-w-2xl{% else %}max-w-full{% endif %}">
  {% image value.image width-800 class="h-auto w-full border-[3px] border-ink" alt=value.caption|default:"" %}
  {% if value.caption %}
    <figcaption class="mt-2 text-center text-sm text-muted">{{ value.caption }}</figcaption>
  {% endif %}
</figure>
