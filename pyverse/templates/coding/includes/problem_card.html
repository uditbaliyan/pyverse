{% load wagtailcore_tags %}
<div class="pe-card">
  <div class="pe-card-head">
    <p class="pe-card-title">{{ problem.title }}</p>
    <span class="pe-badge pe-badge--coding">Coding</span>
  </div>
  <div class="pe-card-meta">
    def {{ problem.function_name }}(...):
    {% if problem.topic %}&middot; {{ problem.topic.title }}
    {%endif %} &middot; {{ problem.test_cases|length }} test case{{
    problem.test_cases|length|pluralize }}
  </div>
</div>
