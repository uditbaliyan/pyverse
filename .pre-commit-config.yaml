exclude: '^docs/|/migrations/|devcontainer.json'
default_stages: [pre-commit]
minimum_pre_commit_version: "3.2.0"

default_language_version:
  python: python3.14

repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      # Vendored third-party assets are kept byte-for-byte as upstream shipped.
      - id: trailing-whitespace
        exclude: ^pyverse/static/(puput|colorful|vendor)/
      - id: end-of-file-fixer
        exclude: ^pyverse/static/(puput|colorful|vendor)/
      - id: check-json
      - id: check-toml
      - id: check-xml
        # Django template, not standalone XML: the `{% comment %}` block after
        # the XML declaration is not well-formed. The rendered output is
        # validated by pyverse/tests/test_sitemap.py instead.
        exclude: ^pyverse/templates/sitemap\.xml$
      - id: check-yaml
      - id: debug-statements
      - id: check-builtin-literals
      - id: check-case-conflict
      - id: check-merge-conflict
      - id: check-docstring-first
      - id: detect-private-key

  - repo: https://github.com/adamchainz/django-upgrade
    rev: '1.31.1'
    hooks:
      - id: django-upgrade
        args: ['--target-version', '6.0']

  # Run the Ruff linter.
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.15.21
    hooks:
      # Linter
      - id: ruff-check
        args: [--fix, --exit-non-zero-on-fix]
      # Formatter
      - id: ruff-format

  - repo: https://github.com/tox-dev/pyproject-fmt
    rev: v2.25.2
    hooks:
      - id: pyproject-fmt

  - repo: https://github.com/djlint/djLint
    rev: v1.40.6
    hooks:
      # Django-profile rules only make sense for real Django templates. The
      # standalone HTML apps/prototypes under neetcode/ and temp/ are not
      # Django templates (no {% extends %}, own JS runtimes), so they are
      # deliberately out of scope here rather than excluded rule-by-rule.
      - id: djlint-reformat-django
        files: ^pyverse/(templates|theme/templates)/
      - id: djlint-django
        files: ^pyverse/(templates|theme/templates)/

# sets up .pre-commit-ci.yaml to ensure pre-commit dependencies stay up to date
ci:
  autoupdate_schedule: weekly
  skip: []
  submodules: false
